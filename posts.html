<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <style>
      .author-link {
        color: red;
        font-size: 1.2rem;
        cursor: pointer;
      }
    </style>
    <title>Home</title>
  </head>
  <body>
    <div class="container mt-4">
      <div id="posts" class="row"></div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const postsContainer = document.getElementById("posts");

        fetch("https://jsonplaceholder.typicode.com/posts?_limit=10")
          .then((response) => response.json())
          .then((posts) => {
            posts.forEach((post) => {
              const col = document.createElement("div");
              col.className = "col-md-6 mb-4";

              const card = document.createElement("div");
              card.className = "card p-3";

              const titleEl = document.createElement("h5");
              titleEl.textContent = post.title;

              const authorLink = document.createElement("span");
              authorLink.textContent = "Show author info";
              authorLink.className = "author-link d-block mt-2";

              const infoDiv = document.createElement("div");
              infoDiv.className = "author-info mt-2";

              authorLink.addEventListener("click", () => {
                Promise.all([
                  fetch(
                    `https://jsonplaceholder.typicode.com/users/${post.userId}`
                  ).then((res) => res.json()),
                  fetch(
                    `https://jsonplaceholder.typicode.com/posts?userId=${post.userId}`
                  ).then((res) => res.json()),
                ])
                  .then(([user, userPosts]) => {
                    infoDiv.textContent = `Username: ${user.username} | Number of posts: ${userPosts.length}`;
                  })
                  .catch(() => {
                    infoDiv.textContent = "Error loading author data.";
                  });
              });

              card.appendChild(titleEl);
              card.appendChild(authorLink);
              card.appendChild(infoDiv);
              col.appendChild(card);
              postsContainer.appendChild(col);
            });
          })
          .catch(() => {
            postsContainer.innerHTML =
              "<p class='text-danger'>Error loading posts.</p>";
          });
      });
    </script>
  </body>
</html>
